# ---------------------------------------------------------------------------
# Prefix
# ---------------------------------------------------------------------------
unbind C-b
set -g prefix 'C-\'
bind 'C-\' send-prefix

# ---------------------------------------------------------------------------
# Keybindings: vi
# ---------------------------------------------------------------------------
set -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ---------------------------------------------------------------------------
# Windows: alt+Left / alt+Right
# ---------------------------------------------------------------------------
bind -n M-Left previous-window
bind -n M-Right next-window

# ---------------------------------------------------------------------------
# Sessions: alt+Up / alt+Down
# ---------------------------------------------------------------------------
bind -n M-Up switch-client -p
bind -n M-Down switch-client -n

# ---------------------------------------------------------------------------
# Panes: alt+h/j/k/l, seamless with Neovim splits
#
# When the active pane is running (n)vim, the alt+hjkl keystroke is passed
# through to Neovim so its own navigation mapping (e.g. vim-tmux-navigator)
# can handle it; otherwise tmux moves the pane selection itself. For this to
# be truly seamless, Neovim needs the matching side of the integration too
# (e.g. the vim-tmux-navigator plugin, or manual <M-h/j/k/l> mappings that
# call TmuxNavigate on the Neovim side).
# ---------------------------------------------------------------------------
is_vim="ps -o state=,comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind -n M-h if-shell "$is_vim" 'send-keys M-h' 'select-pane -L'
bind -n M-j if-shell "$is_vim" 'send-keys M-j' 'select-pane -D'
bind -n M-k if-shell "$is_vim" 'send-keys M-k' 'select-pane -U'
bind -n M-l if-shell "$is_vim" 'send-keys M-l' 'select-pane -R'

bind -T copy-mode-vi M-h select-pane -L
bind -T copy-mode-vi M-j select-pane -D
bind -T copy-mode-vi M-k select-pane -U
bind -T copy-mode-vi M-l select-pane -R

# ---------------------------------------------------------------------------
# Mouse: click to select panes/windows, drag borders to resize
# ---------------------------------------------------------------------------
set -g mouse on

# ---------------------------------------------------------------------------
# Status line
# ---------------------------------------------------------------------------
set -g status-interval 5
set -g status-style 'bg=default,fg=colour245'

set -g status-left-length 20
set -g status-left ' #[fg=colour39,bold]#S '

set -g window-status-format ' #I:#W '
set -g window-status-current-format ' #[fg=colour39,bold]#I:#W '

set -g status-right-length 60
set -g status-right '#[fg=colour208,bold]#H #[fg=colour238]| #[fg=colour245]#(~/.config/tmux/scripts/tmux-stats.sh) #[fg=colour238]| #[fg=colour245]%Y-%m-%d %H:%M '
